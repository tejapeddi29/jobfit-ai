<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="#fafbfc" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">JobFit AI — Architecture Flow</text>

  <!-- ═══ ROW 1: Inputs ═══ -->
  <g filter="url(#shadow)">
    <rect x="60" y="60" width="180" height="64" rx="10" fill="#E8F4FD" stroke="#3B8BD4" stroke-width="1"/>
    <text x="150" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#185FA5">Job URL / Text</text>
    <text x="150" y="106" text-anchor="middle" font-size="11" fill="#3B8BD4">scraper.py</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="280" y="60" width="180" height="64" rx="10" fill="#E8F4FD" stroke="#3B8BD4" stroke-width="1"/>
    <text x="370" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#185FA5">Resume PDF / Text</text>
    <text x="370" y="106" text-anchor="middle" font-size="11" fill="#3B8BD4">parser.py</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="60" width="180" height="64" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
    <text x="590" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Model Select</text>
    <text x="590" y="106" text-anchor="middle" font-size="11" fill="#7F77DD">Claude / GPT-4o</text>
  </g>

  <!-- Action buttons -->
  <g filter="url(#shadow)">
    <rect x="720" y="60" width="140" height="28" rx="6" fill="#534AB7" stroke="none"/>
    <text x="790" y="79" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">🔍 Analyze Match</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="720" y="96" width="140" height="28" rx="6" fill="#0F6E56" stroke="none"/>
    <text x="790" y="115" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">✨ Tailor Resume</text>
  </g>

  <!-- Arrows from inputs -->
  <line x1="150" y1="124" x2="150" y2="175" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="124" x2="370" y2="175" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══ ROW 2: Chunking ═══ -->
  <g filter="url(#shadow)">
    <rect x="100" y="178" width="320" height="56" rx="10" fill="#FFF8E6" stroke="#BA7517" stroke-width="1"/>
    <text x="260" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">LangChain TextSplitter</text>
    <text x="260" y="220" text-anchor="middle" font-size="11" fill="#BA7517">500 char chunks · 100 overlap · metadata tagging</text>
  </g>

  <line x1="260" y1="234" x2="260" y2="280" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══ ROW 3: ChromaDB ═══ -->
  <g filter="url(#shadow)">
    <rect x="60" y="283" width="400" height="80" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
    <text x="260" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#085041">ChromaDB — vectorstore.py</text>
    <text x="260" y="328" text-anchor="middle" font-size="11" fill="#0F6E56">HuggingFace embeddings (free) or OpenAI embeddings</text>
    <text x="260" y="348" text-anchor="middle" font-size="11" fill="#0F6E56">Semantic similarity search · Cosine scoring · Metadata filtering</text>
  </g>

  <!-- Embedding model box -->
  <g filter="url(#shadow)">
    <rect x="500" y="283" width="200" height="80" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="600" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#444441">Embedding Models</text>
    <text x="600" y="330" text-anchor="middle" font-size="10" fill="#5F5E5A">🆓 all-MiniLM-L6-v2</text>
    <text x="600" y="348" text-anchor="middle" font-size="10" fill="#5F5E5A">💰 text-embedding-3-small</text>
  </g>

  <line x1="460" y1="323" x2="498" y2="323" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>

  <line x1="260" y1="363" x2="260" y2="415" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="268" y="396" font-size="10" fill="#888">Match evidence + scores</text>

  <!-- ═══ ROW 4: LangChain Chains ═══ -->
  <g filter="url(#shadow)">
    <rect x="60" y="418" width="400" height="80" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
    <text x="260" y="443" text-anchor="middle" font-size="14" font-weight="700" fill="#4A1B0C">LangChain Pipeline — chains.py</text>
    <text x="260" y="463" text-anchor="middle" font-size="11" fill="#993C1D">ChatPromptTemplate → ChatAnthropic/ChatOpenAI → PydanticOutputParser</text>
    <text x="260" y="483" text-anchor="middle" font-size="11" fill="#993C1D">Analysis chain + Tailoring chain · Structured JSON output</text>
  </g>

  <!-- Pydantic models box -->
  <g filter="url(#shadow)">
    <rect x="500" y="418" width="200" height="80" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="600" y="443" text-anchor="middle" font-size="12" font-weight="600" fill="#444441">models.py</text>
    <text x="600" y="463" text-anchor="middle" font-size="10" fill="#5F5E5A">JobAnalysis (score, skills,</text>
    <text x="600" y="478" text-anchor="middle" font-size="10" fill="#5F5E5A">gaps, tweaks, keywords)</text>
    <text x="600" y="493" text-anchor="middle" font-size="10" fill="#5F5E5A">TailoredResume (bullets, diffs)</text>
  </g>

  <line x1="460" y1="458" x2="498" y2="458" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Fork arrows -->
  <line x1="180" y1="498" x2="140" y2="555" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="498" x2="430" y2="555" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══ ROW 5: Output Tabs ═══ -->
  <!-- Tab 1: Analysis -->
  <g filter="url(#shadow)">
    <rect x="30" y="558" width="280" height="105" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
    <text x="170" y="582" text-anchor="middle" font-size="13" font-weight="700" fill="#3C3489">📊 Tab 1: Match Analysis</text>
    <text x="170" y="602" text-anchor="middle" font-size="10" fill="#534AB7">Match score (0-100) · Matched/missing skills</text>
    <text x="170" y="618" text-anchor="middle" font-size="10" fill="#534AB7">Experience alignment · Gap analysis</text>
    <text x="170" y="634" text-anchor="middle" font-size="10" fill="#534AB7">Resume tweaks · ATS keywords · Interview tips</text>
    <text x="170" y="654" text-anchor="middle" font-size="10" fill="#534AB7">📥 Export: JSON</text>
  </g>

  <!-- Tab 2: Tailored Resume -->
  <g filter="url(#shadow)">
    <rect x="340" y="558" width="280" height="105" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
    <text x="480" y="582" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">📄 Tab 2: Tailored Resume</text>
    <text x="480" y="602" text-anchor="middle" font-size="10" fill="#0F6E56">New professional summary · Optimized skills</text>
    <text x="480" y="618" text-anchor="middle" font-size="10" fill="#0F6E56">Rewritten experience bullets · Before/after diffs</text>
    <text x="480" y="634" text-anchor="middle" font-size="10" fill="#0F6E56">Change log with reasoning for each edit</text>
    <text x="480" y="654" text-anchor="middle" font-size="10" fill="#0F6E56">📥 Export: DOCX · Markdown · JSON</text>
  </g>

  <!-- Config box -->
  <g filter="url(#shadow)">
    <rect x="660" y="558" width="200" height="105" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="760" y="582" text-anchor="middle" font-size="12" font-weight="600" fill="#444441">config.py</text>
    <text x="760" y="604" text-anchor="middle" font-size="10" fill="#5F5E5A">ANTHROPIC_API_KEY</text>
    <text x="760" y="620" text-anchor="middle" font-size="10" fill="#5F5E5A">OPENAI_API_KEY (optional)</text>
    <text x="760" y="636" text-anchor="middle" font-size="10" fill="#5F5E5A">EMBEDDING_MODEL=free</text>
    <text x="760" y="654" text-anchor="middle" font-size="10" fill="#5F5E5A">DEFAULT_MODEL=claude</text>
  </g>

</svg>
